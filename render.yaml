# Render Blueprint — https://render.com/docs/blueprint-spec
# One free Docker web service: Spring Boot serves both the API and the built React app.
services:
  - type: web
    name: glaze-app
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=65 -XX:+UseSerialGC -Xss512k -XX:TieredStopAtLevel=1
